name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the latest Go: golangci-lint v2.15.0 needs go >= 1.26 to build, newer than the module's minimum
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      # the pinned version in the Makefile - the same lint as make lint locally
      - name: golangci-lint
        run: make lint

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: docker build -t skima:ci .

  integration:
    name: Apply against Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # the official image via AWS's public mirror, which avoids Docker Hub's anonymous pull rate limit
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      SKM_DBCONN_CONNSTRING: localhost
      SKM_DBCONN_PORT: "5432"
      SKM_DBCONN_DATABASE: postgres
      SKM_DBCONN_SCHEMA: ci_schema
      SKM_DBCONN_USERNAME: ci_user
      SKM_DBCONN_PASSWORD: ci_pass
      SKM_WORKDIR: testdata/ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o skima .

      - name: Generated changesets verify against postgres
        # verify builds in a scratch schema that is rolled back, which needs the CREATE privilege - the superuser has it
        env:
          SKIMA_VERIFY_DATABASE: "1"
          SKM_DBCONN_SCHEMA: public
          SKM_DBCONN_USERNAME: postgres
          SKM_DBCONN_PASSWORD: postgres
        run: go test -count=1 -v ./internal/verify

      - name: Bootstrap schema
        run: ./skima apply --bootstrap
        env:
          SKM_DBCONN_SUPERUSER: postgres
          SKM_DBCONN_SUPERUSERPWD: postgres

      - name: Plan shows the state build
        run: |
          ./skima plan --from none
          # reads the database, which skima does not manage yet - 2 means changes are pending
          status=0
          ./skima plan --detailed-exitcode > /dev/null || status=$?
          [ "$status" -eq 2 ]

      - name: Apply state
        run: ./skima apply

      - name: Plan has nothing left to apply
        run: ./skima plan --detailed-exitcode

      - name: Verify schema
        run: |
          tables=$(psql -h localhost -U postgres -d postgres -tAc \
            "select string_agg(table_name, ',' order by table_name) from information_schema.tables where table_schema = 'ci_schema'")
          echo "tables: $tables"
          [ "$tables" = "documents,projects,skima_schema_history,skima_schema_statements" ]
          status=$(psql -h localhost -U postgres -d postgres -tAc \
            "select schema_version || ':' || status from ci_schema.skima_schema_history where apply_type = 'state'")
          echo "state run: $status"
          [ "$status" = "1.0.0:success" ]
          # apply executes the plan, so it records a success row per planned statement
          planned=$(./skima plan --from none --output=json | jq '[.units[].steps[] | select(.skipped != true) | .sql | length] | add')
          recorded=$(psql -h localhost -U postgres -d postgres -tAc \
            "select count(*) from ci_schema.skima_schema_statements s join ci_schema.skima_schema_history h using (run_id) where h.apply_type = 'state' and s.status = 'success'")
          echo "state build: planned $planned statements, recorded $recorded"
          [ "$planned" = "$recorded" ]

      - name: Plan the next release
        env:
          SKM_WORKDIR: testdata/ci-next
        run: |
          ./skima plan
          status=0
          ./skima plan --detailed-exitcode > /dev/null || status=$?
          [ "$status" -eq 2 ]

      - name: Rerunning the state sql files leaves the changesets pending
        env:
          SKM_WORKDIR: testdata/ci-next
        run: |
          # an apply --sql run is recorded at the manifest's version, but it applies no changesets
          ./skima apply --sql
          status=0
          ./skima plan --detailed-exitcode > /dev/null || status=$?
          [ "$status" -eq 2 ]

      - name: A failed statement is recorded whole
        env:
          SKM_WORKDIR: testdata/ci-failing
        run: |
          rm -rf testdata/ci-failing && cp -R testdata/ci-next testdata/ci-failing
          # longer than 200 bytes, with multi-byte characters
          stmt="select '$(printf 'é%.0s' $(seq 1 150))' from no_such_table"
          jq -n --arg stmt "$stmt" '{version: "1.0.2", description: "fails", deltas: [{object: "script", description: "fails", sql: [$stmt]}]}' > testdata/ci-failing/deltas/v1_0_2.json
          status=0
          ./skima apply || status=$?
          [ "$status" -eq 1 ]
          recorded=$(psql -h localhost -U postgres -d postgres -tAc \
            "select s.status || ':' || (s.description like '%no_such_table') from ci_schema.skima_schema_statements s join ci_schema.skima_schema_history h using (run_id) where h.delta_file = 'v1_0_2.json' and h.status = 'rolled back'")
          echo "failed statement: $recorded"
          [ "$recorded" = "failed:true" ]
          # the failed run is cleaned up so the next release's checks see only its own runs
          psql -h localhost -U postgres -d postgres -c "delete from ci_schema.skima_schema_history where status <> 'success'"
          rm -rf testdata/ci-failing

      - name: Apply the next release
        env:
          SKM_WORKDIR: testdata/ci-next
        run: ./skima apply

      - name: Verify the next release
        env:
          SKM_WORKDIR: testdata/ci-next
        run: |
          ./skima plan --detailed-exitcode
          status=$(psql -h localhost -U postgres -d postgres -tAc \
            "select schema_version || ':' || status from ci_schema.skima_schema_history where delta_file = 'v1_0_1.json'")
          echo "changeset run: $status"
          [ "$status" = "1.0.1:success" ]
          tags=$(psql -h localhost -U postgres -d postgres -tAc "select count(*) from ci_schema.tags")
          echo "tags: $tags"
          [ "$tags" = "1" ]
          planned=$(./skima plan --from 1.0.0 --output=json | jq '[.units[].steps[] | select(.skipped != true) | .sql | length] | add')
          recorded=$(psql -h localhost -U postgres -d postgres -tAc \
            "select count(*) from ci_schema.skima_schema_statements s join ci_schema.skima_schema_history h using (run_id) where h.delta_file = 'v1_0_1.json' and s.status = 'success'")
          echo "changeset 1.0.1: planned $planned statements, recorded $recorded"
          [ "$planned" = "$recorded" ]

      - name: No drift after applying
        env:
          SKM_WORKDIR: testdata/ci-next
        run: ./skima drift --detailed-exitcode

      - name: Drift is reported
        env:
          SKM_WORKDIR: testdata/ci-next
        run: |
          # change the schema behind skima's back
          psql -h localhost -U postgres -d postgres \
            -c "alter table ci_schema.documents add column legacy_ref text" \
            -c "drop index ci_schema.documents_created_idx" \
            -c "alter table ci_schema.projects alter column description set default 'none'" \
            -c "comment on column ci_schema.projects.name is 'edited by hand'" \
            -c "alter type ci_schema.tag_color add value 'purple'" \
            -c "alter sequence ci_schema.tag_seq increment by 7" \
            -c "create sequence ci_schema.stray_seq" \
            -c "alter table ci_schema.projects add column legacy_no serial" \
            -c "drop index ci_schema.tag_counts_label_idx"
          ./skima drift
          status=0
          ./skima drift --detailed-exitcode > /dev/null || status=$?
          [ "$status" -eq 2 ]
          found=$(./skima drift --output=json | jq -r '[.findings[] | "\(.change) \(.object) \(.name) \(.attribute // "")" | rtrimstr(" ")] | join(";")')
          echo "found: $found"
          # the serial column's sequence belongs to the column, so it is not reported on its own
          [ "$found" = "extra column documents.legacy_ref;missing index documents.documents_created_idx;changed column projects.description default;extra column projects.legacy_no;changed column projects.name comment;extra sequence stray_seq;changed enum tag_color;missing index tag_counts.tag_counts_label_idx;changed sequence tag_seq increment" ]
          # ignored differences are not drift
          ./skima drift --ignore documents.legacy_ref --ignore 'documents.*_idx' --ignore projects --ignore tag_color --ignore '*_seq' --ignore tag_counts --detailed-exitcode
