version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      # output and best-effort cleanup: nothing useful to do with these errors
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - os.Remove
        - os.RemoveAll
        - (github.com/jackc/pgx/v5.Tx).Rollback

formatters:
  enable:
    - gofmt
